<style>
/* Layout: my Chrome window in quiet ivory and walnut; the real favicons are the color. The bookmark bar is the
   navigation: each bookmark is a chapter, wearing the favicon of the site whose data drives it. One chapter at a
   time fills the page, and every chapter is something to touch: drag, scrub, step, click a day. */
:root {
  --frame: #E9E3DB; --frame-2: #DED6CC; --bar: #F7F3EE; --omni: #ECE6DF; --page: #FDFBF8; --surface: #FFFFFF;
  --pk1: #C8577A; --pk2: #E28DA6; --pk3: #9E3556; --pk4: #D46F8E; --pk5: #B4486B;
  --ink: #2B211C; --muted: #7C7067; --rule: #E6DED4; --rose: #A9676B; --rose-soft: #F3E6E4; --sel: #2B211C; --on-sel: #FDFBF8;
  --t-fashion: #B97979; --t-beauty: #8A5A86; --t-food: #B08A3C; --t-places: #4F6B4A; --t-rest: #A79C92; --t-none: #E4DCD2;
  --night: #2B211C;
  --ui: "Figtree", "Segoe UI", system-ui, sans-serif; --serif: "Newsreader", Georgia, serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --frame: #231C18; --frame-2: #2E2520; --bar: #1B1512; --omni: #2E2520; --page: #16110F; --surface: #211A16;
  --pk1: #E58FA8; --pk2: #F3B9C9; --pk3: #D46F8E; --pk4: #EBA2B7; --pk5: #DB7F9C;
  --ink: #F1EAE2; --muted: #A99C91; --rule: #352B25; --rose: #D79A9E; --rose-soft: #3A2A29; --sel: #F1EAE2; --on-sel: #16110F;
  --t-fashion: #D49598; --t-beauty: #B98BB4; --t-food: #D2AE62; --t-places: #8DAA86; --t-rest: #7D7168; --t-none: #3A302A; --night: #FFFFFF; color-scheme: dark; } }
:root[data-theme="dark"] {
  --frame: #231C18; --frame-2: #2E2520; --bar: #1B1512; --omni: #2E2520; --page: #16110F; --surface: #211A16;
  --pk1: #E58FA8; --pk2: #F3B9C9; --pk3: #D46F8E; --pk4: #EBA2B7; --pk5: #DB7F9C;
  --ink: #F1EAE2; --muted: #A99C91; --rule: #352B25; --rose: #D79A9E; --rose-soft: #3A2A29; --sel: #F1EAE2; --on-sel: #16110F;
  --t-fashion: #D49598; --t-beauty: #B98BB4; --t-food: #D2AE62; --t-places: #8DAA86; --t-rest: #7D7168; --t-none: #3A302A; --night: #FFFFFF; color-scheme: dark; }

html, body { height: 100%; }
body { margin: 0; background: var(--frame); color: var(--ink); font-family: var(--ui); overflow: hidden; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
.fv { width: 16px; height: 16px; border-radius: 3px; flex: 0 0 auto; object-fit: contain; display: inline-block; vertical-align: middle; }
.fv.l { display: inline-grid; place-items: center; font: 700 10px var(--ui); color: var(--on-sel); background: var(--ink); border-radius: 50%; }
.win { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto minmax(0, 1fr); }

/* tab strip: 473 tabs open, so most shrink to bare favicons, like real Chrome */
.strip { display: flex; align-items: flex-end; gap: 2px; padding: 8px 10px 0; min-width: 0; overflow: hidden; }
.lights { display: flex; gap: 8px; padding: 0 12px 12px 4px; flex: 0 0 auto; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #E0695F; } .lights i:nth-child(2) { background: #E2B04A; } .lights i:nth-child(3) { background: #69A55A; }
.tab { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 9px 9px 0 0; font-size: 13px; flex: 0 0 auto; }
.tab.on { background: var(--bar); width: 210px; }
.tab.on .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tab.mini { padding: 0 10px; position: relative; flex: 1 1 0; min-width: 36px; max-width: 180px; justify-content: center; container-type: inline-size; }
.tab.mini .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); }
@container (max-width: 84px) { .tab.mini .t { display: none; } }
@media (max-width: 640px) { .tab.mini:nth-child(n+7) { display: none; } .tab.mini { min-width: 0; } }
.tab.mini::after { content: ""; position: absolute; right: -1px; top: 10px; bottom: 10px; width: 1px; background: var(--frame-2); }
.tab.mini:hover { background: var(--frame-2); }
.count { margin-left: auto; flex: 0 0 auto; align-self: center; margin-bottom: 4px; font-size: 12.5px; color: var(--muted); padding: 5px 10px; border-radius: 999px; background: var(--frame-2); white-space: nowrap; }
.count b { color: var(--ink); }

.toolbar { display: flex; align-items: center; gap: 4px; padding: 6px 10px; background: var(--bar); }
.tb { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); font-size: 16px; }
.tb:hover { background: var(--omni); color: var(--ink); }
.omni { flex: 1; min-width: 0; height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 999px; background: var(--omni); font-size: 14px; }
.omni input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font: 14px var(--ui); color: var(--ink); }
.omni input::placeholder { color: var(--muted); }
.omni .path { color: var(--muted); white-space: nowrap; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--on-sel); background: var(--ink); margin-left: 6px; }
.who { font-size: 12px; color: var(--muted); white-space: nowrap; margin-left: 6px; }

/* the bookmark bar is the navigation */
.bms { display: flex; align-items: center; gap: 4px; padding: 8px 10px 10px; background: var(--bar); border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
.bms::-webkit-scrollbar { display: none; }
.bm { display: flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 999px; font-size: 13.5px; white-space: nowrap; position: relative; }
.bm:hover { background: var(--omni); }
.bm[aria-current="page"] { background: var(--omni); font-weight: 600; }
.bm[aria-current="page"]::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: -6px; height: 2px; border-radius: 2px; background: var(--ink); }
.bms .sep { width: 1px; height: 18px; background: var(--rule); margin: 0 6px; flex: 0 0 auto; }

.page { background: var(--page); overflow-y: auto; position: relative; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 30px 24px 120px; box-sizing: border-box; }
.kicker { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
h1.q { font-family: var(--serif); font-weight: 400; font-size: clamp(32px, 4.2vw, 50px); line-height: 1.04; letter-spacing: -.02em; margin: 10px 0 8px; text-wrap: balance; }
h1.q em { font-style: italic; color: var(--rose); }
.lede { font-family: var(--serif); font-size: 18px; line-height: 1.5; max-width: 62ch; margin: 0 0 22px; color: var(--ink); opacity: .88; }
.two { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 36px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; padding: 20px; }
.src { font-family: var(--mono); font-size: 12px; color: var(--rose); border-bottom: 1px solid currentColor; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--rule); font-size: 13px; background: var(--surface); display: inline-flex; gap: 6px; align-items: center; }
.pill[aria-pressed="true"] { background: var(--sel); color: var(--on-sel); border-color: var(--sel); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.pill.go { background: var(--ink); color: var(--on-sel); border-color: var(--ink); font-weight: 600; }
.lbl { font-size: 12px; color: var(--muted); margin-right: 2px; }
.big { font-family: var(--ui); font-weight: 700; font-size: 44px; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.sub { font-size: 13.5px; color: var(--muted); margin-top: 4px; }
.row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; padding: 5px 0; }
.row .track { height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; margin-top: 4px; }
.row .track b { display: block; height: 100%; background: var(--ink); border-radius: 3px; transition: width .35s; }
.row .v { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.row img { width: 20px; height: 20px; }

/* home */
.home { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; padding: 40px 16px 56px; box-sizing: border-box; }
.mark { font-family: var(--serif); font-weight: 400; font-size: clamp(76px, 13vw, 168px); letter-spacing: -.04em; line-height: .9; margin: 0; }
.mark em { color: var(--rose); }
.mark { font-family: "Outfit", var(--ui); font-weight: 500; letter-spacing: -.035em; line-height: 1; }
.mark .m0 { color: var(--pk1); } .mark .m1 { color: var(--pk2); } .mark .m2 { color: var(--pk3); } .mark .m3 { color: var(--pk4); } .mark .m4 { color: var(--pk5); } .mark .m5 { color: var(--pk2); }
.gbar { padding: 0 10px 0 12px; gap: 6px; border-color: transparent; box-shadow: 0 1px 6px rgba(43, 33, 28, .14), 0 0 0 1px var(--rule); }
.gbar:focus-within { box-shadow: 0 2px 14px rgba(43, 33, 28, .18), 0 0 0 1px var(--rule); }
.gplus { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); flex: 0 0 auto; }
.gplus:hover { background: var(--omni); }
.gplus svg { width: 26px; height: 26px; }
.gask { display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 22px 0 18px; border-radius: 999px; background: var(--omni); font: 600 19px var(--ui); color: var(--ink); flex: 0 0 auto; }
.gask:hover { background: var(--frame-2); }
.gask svg { width: 24px; height: 24px; }
.gcards { display: flex; justify-content: center; gap: 14px; width: min(980px, 100%); }
.gcard { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 14px; background: var(--rose-soft); text-align: left; }
.gcard:hover { filter: brightness(.97); }
.gcard b { display: block; font: 600 16px var(--ui); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gcard small { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }
.gcard > span { min-width: 0; }
@media (max-width: 760px) { .gcards { flex-direction: column; } .gask { padding: 0 14px; font-size: 16px; height: 42px; } .gplus { width: 40px; height: 40px; } }
.sbox { width: min(980px, 100%); height: 84px; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 22px; box-sizing: border-box; border-radius: 999px; background: var(--surface); border: 1px solid var(--rule); box-shadow: 0 2px 10px rgba(43, 33, 28, .07); position: relative; }
.sbox input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: 25px var(--ui); color: var(--ink); }
.sbox input::placeholder { color: var(--muted); }
.ac { position: absolute; top: 100%; left: 0; right: 0; margin-top: 6px; background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; padding: 6px 0; box-shadow: 0 10px 30px rgba(43, 33, 28, .1); z-index: 5; }
.ac button { display: flex; gap: 12px; align-items: center; width: 100%; padding: 9px 18px; text-align: left; font-size: 15px; }
.ac button:hover, .ac button[aria-selected="true"] { background: var(--omni); }
.ac small { margin-left: auto; color: var(--muted); font-size: 12px; }
.tiles { display: grid; grid-template-columns: repeat(4, 110px); gap: 14px 24px; margin-top: 8px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; text-align: center; }
.tile .c { width: 54px; height: 54px; border-radius: 50%; background: var(--omni); display: grid; place-items: center; transition: transform .15s; }
.tile .c img { width: 26px; height: 26px; }
.tile:hover .c { transform: translateY(-2px); }
.tile small { color: var(--muted); font-size: 11.5px; margin-top: -5px; }
.tiles-h { font-size: 13px; color: var(--muted); }

/* clock */
.clock { position: relative; width: 100%; aspect-ratio: 1; max-width: 620px; margin: 0 auto; }
.clock canvas, .clock svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.clock svg { overflow: visible; touch-action: none; cursor: grab; }
.clock svg:active { cursor: grabbing; }
.read { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
.read b { display: block; font-size: 34px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.read span { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; }

/* days */
.calwrap { overflow-x: auto; padding: 4px 4px 8px; margin: -4px -4px 0; }
.cal { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; width: max-content; }
.cal button { width: 17px; height: 17px; border-radius: 4px; display: grid; place-items: center; background: var(--surface); transition: opacity .2s, transform .15s; }
.cal button img { width: 14px; height: 14px; }
.cal button:hover { transform: scale(1.6); z-index: 2; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
.cal button.off { opacity: .1; }
.cal .gap { visibility: hidden; }
.months { display: grid; grid-auto-flow: column; gap: 3px; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.dayinfo { min-height: 64px; }

/* stepper */
.step { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
.step .t { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.step .s { font-family: var(--serif); font-size: 18px; }
.step.dim { opacity: .25; }
.step.cur .s { color: var(--rose); }
.lock { display: inline-block; height: .8em; width: 7em; background: var(--ink); opacity: .85; border-radius: 2px; vertical-align: -0.05em; }
.strip2 { display: flex; gap: 2px; align-items: flex-end; height: 70px; margin: 10px 0; }
.strip2 div { flex: 1; display: flex; flex-direction: column-reverse; gap: 1px; }
.strip2 i { display: block; border-radius: 2px; }

/* trips */
.trips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.trip { text-align: left; padding: 14px; border-radius: 14px; border: 1px solid var(--rule); background: var(--surface); }
.trip b { display: block; font-family: var(--serif); font-size: 21px; font-weight: 400; }
.trip span { font-size: 12.5px; color: var(--muted); }
.trip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.dream { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

/* bars */
.bars { display: flex; align-items: flex-end; gap: 6px; height: 220px; }
.bars button { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; height: 100%; font-size: 11px; color: var(--muted); }
.bars button i { display: block; width: 100%; border-radius: 6px 6px 2px 2px; background: var(--ink); opacity: .85; transition: opacity .2s; min-height: 2px; }
.bars button[aria-pressed="true"] i { background: var(--rose); opacity: 1; }
.bars button:hover i { opacity: 1; }

/* learning */
.line { position: relative; height: 90px; margin: 10px 8px 0; }
.line::before { content: ""; position: absolute; left: 0; right: 0; top: 44px; height: 2px; background: var(--rule); }
.line button { position: absolute; top: 34px; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; background: var(--surface); border: 2px solid var(--c); display: grid; place-items: center; }
.line button img { width: 12px; height: 12px; }
.line button[aria-pressed="true"] { background: var(--c); transform: scale(1.25); }
.line .m { position: absolute; top: 70px; font-size: 11px; color: var(--muted); transform: translateX(-50%); }

/* evidence */
.ev { position: fixed; left: 0; right: 0; bottom: 0; max-height: 55%; display: flex; flex-direction: column; background: var(--surface); border-top: 2px solid var(--ink); z-index: 8; box-shadow: 0 -20px 50px -20px rgba(0,0,0,.25); }
.ev header { display: flex; gap: 12px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--rule); font-family: var(--mono); font-size: 12px; }
.ev header .p { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.ev header .p b { color: var(--ink); font-weight: 600; }
.ev header button { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--rule); }
.ev .sc { overflow: auto; padding-bottom: 14px; }
.ev .note { padding: 10px 18px 4px; font-size: 12.5px; color: var(--muted); }
.ev table { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.ev th, .ev td { padding: 5px 18px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--rule); }
.ev th { position: sticky; top: 0; background: var(--surface); color: var(--muted); font-weight: 400; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; }
.ev td.n { color: var(--muted); width: 1%; text-align: right; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stp { background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; padding: 18px; }
@media (max-width: 900px) { .steps { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
@media (max-width: 560px) { .steps { grid-template-columns: minmax(0, 1fr); } }
.terms { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.term { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 7px; }
.course { font-family: var(--serif); font-size: 16px; line-height: 1.25; }
.course.code { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.badge { font: 600 11.5px var(--ui); padding: 3px 8px; border-radius: 999px; background: var(--rose-soft); color: var(--rose); white-space: nowrap; }
.doodle { position: relative; display: inline-block; }
.doodle .mark { cursor: pointer; }
#dood { position: absolute; pointer-events: auto; opacity: 0; }
.dcap { position: absolute; left: 50%; top: -30px; transform: translateX(-50%); white-space: nowrap; font: 12px var(--mono); color: var(--muted); opacity: 0; transition: opacity .4s; pointer-events: none; }
.dcap.on { opacity: 1; }
@media (max-width: 640px) { .dcap { white-space: normal; width: 90vw; text-align: center; } }

<script>

  const st = g.filter(x => x.c >= 30 && x.lift >= 1.4).sort((a, b) => b.lift - a.lift)[0], big = g.slice().sort((a, b) => b.p - a.p)[0], si = signature(H);
  return { level, text: (st ? `${GNAME[st.g][0].toUpperCase() + GNAME[st.g].slice(1)} stands out: ${Math.round(st.p * 100)}% of her searches at ${hs(H)}, ${st.lift.toFixed(1)}× her usual share.` : `No single topic owns this hour; the biggest is ${GNAME[big.g]}, at ${Math.round(big.p * 100)}% of her searches.`)

const SITE_HTOT = Array.from({ length: 24 }, (_, h) => D.sites.reduce((a, s) => a + s.h[h], 0)), SITE_ALL = SITE_HTOT.reduce((a, b) => a + b, 0);

const signature = h => D.sites.filter(s => s.h[h] >= 25 && s.n >= 300).sort((a, b) => (b.h[h] / SITE_HTOT[h]) / (b.n / SITE_ALL) - (a.h[h] / SITE_HTOT[h]) / (a.n / SITE_ALL))[0];

// ----------------------------------------------------------------- evidence

  $('ev').hidden = false;
}

// ----------------------------------------------------------------- the bookmark bar is the navigation

];
const SFAV = '<svg class="fv slogo" viewBox="0 0 100 100" fill="none" stroke-width="17"><path d="M65.3 17.1A20 20 0 1 0 50 50A20 20 0 1 1 34.7 82.9" pathLength="100" stroke="var(--pk1)" stroke-dasharray="25.4 100" stroke-dashoffset="0"/><path d="M65.3 17.1A20 20 0 1 0 50 50A20 20 0 1 1 34.7 82.9" pathLength="100" stroke="var(--pk2)" stroke-dasharray="25.4 100" stroke-dashoffset="-25"/><path d="M65.3 17.1A20 20 0 1 0 50 50A20 20 0 1 1 34.7 82.9" pathLength="100" stroke="var(--pk3)" stroke-dasharray="25.4 100" stroke-dashoffset="-50"/><path d="M65.3 17.1A20 20 0 1 0 50 50A20 20 0 1 1 34.7 82.9" pathLength="100" stroke="var(--pk4)" stroke-dasharray="25.4 100" stroke-dashoffset="-75"/></svg>';
let cur = 'home', curP = {}, hist = [{ id: 'home', p: {} }], hpos = 0;

  const t0 = new Date('2025-10-01'), t1 = new Date('2026-10-01'), x = d => Math.max(0, Math.min(100, (new Date(d) - t0) / (t1 - t0) * 100));
  const months = Object.entries(SI.months).sort(), mm = Math.max(...months.map(m => m[1])), tm = Math.max(...SI.themes.map(t => t.videos));
  $('page').innerHTML = `<div class="wrap">${head(c, `Two things my browser keeps circling: psychology, as a possible interest, and the self-help I watch. Themes and counts only; the more personal videos stay private.`)}
    <div class="two"><div class="panel"><div class="kicker">${fav('wikipedia.org')} psychology · when each theme shows up</div>
      <div style="position:relative;margin-top:16px">${P.map(t => `<div style="margin:0 0 16px"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${t.theme}</span><span class="v">${t.searches} searches</span></div>
        <div style="position:relative;height:8px;background:var(--rule);border-radius:4px;margin-top:6px"><b style="position:absolute;left:${x(t.first)}%;width:${Math.max(2, x(t.last) - x(t.first))}%;top:0;bottom:0;background:var(--t-places);border-radius:4px"></b></div></div>`).join('')}
        <div style="display:flex;justify-content:space-between" class="sub"><span>Oct 2025</span><span>Apr 2026</span><span>Oct 2026</span></div></div></div>
      <div class="panel"><div class="kicker">${fav('youtube.com')} self-help videos</div><div class="big" style="margin-top:8px">${SI.videos}</div><div class="sub">watched this year, most often between ${hs(SI.peak_hours[0])} and ${hs(SI.peak_hours[1] + 1)}</div>
        <div class="bars" style="height:110px;gap:3px;margin-top:14px">${months.map(([m, v]) => `<button aria-label="${m}: ${v} videos" data-tipv="${new Date(m + '-15').toLocaleDateString('en-US', { month: 'long' })} · ${v} videos"><i style="height:${v / mm * 100}%"></i>${new Date(m + '-15').toLocaleDateString('en-US', { month: 'narrow' })}</button>`).join('')}</div>
        <div class="kicker" style="margin:18px 0 6px">what they're about</div>
        ${SI.themes.slice().sort((a, b) => b.videos - a.videos).map(t => `<div class="row"><span></span><div>${t.theme}<div class="track"><b style="width:${t.videos / tm * 100}%"></b></div></div><span class="v">${t.videos}</span></div>`).join('')}</div></div></div>`;
  $('page').querySelectorAll('[data-tipv]').forEach(b => { b.onpointerenter = e => showTip(e, b.dataset.tipv); b.onpointerleave = hideTip; });
};

// ----------------------------------------------------------------- RABBIT HOLE: replay a session
VIEWS.hole = (p = {}) => {
  const c = CH.find(x => x.id === 'hole'), HS = D.rabbit_holes, idx = Math.min(HS.length - 1, +p.i || 0), RH = HS[idx];
  const [h0, m0] = RH.start_time.split(':').map(Number), t0 = h0 * 60 + m0, at = x => hr(((t0 + x) % 1440) / 60);
  const bins = Math.max(...RH.strip.map(s => s[0])) + 1, col = t => ({ nyc: 'places', places: 'places', career: 'places', beauty: 'beauty', fashion: 'fashion', food: 'food' }[t] || 'none');
  const per = Array.from({ length: bins }, (_, i) => RH.strip.filter(s => s[0] === i)), pmax = Math.max(...per.map(p => p.reduce((a, s) => a + s[2], 0)));
  const day = new Date(RH.date + 'T12:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  $('page').innerHTML = `<div class="wrap">${head(c, `One search turns into the next, and the next. Pick one and press play.`)}
    <div class="pills" style="margin-bottom:14px">${HS.map((h, i) => `<button class="pill" data-h="${i}" aria-pressed="${i === idx}">${h.label}</button>`).join('')}</div>
    <div class="panel"><div class="kicker">${day} · ${RH.minutes} minutes · ${RH.searches} searches · each bar ${RH.bucket === 1 ? 'one minute' : RH.bucket + ' minutes'}</div>
      <div class="strip2">${per.map(p => `<div>${p.map(s => `<i style="height:${s[2] / pmax * 66}px;background:var(--t-${col(s[1])})"></i>`).join('')}</div>`).join('')}</div>
      <div style="display:flex;justify-content:space-between" class="sub"><span>${at(0)}</span><span>${at(RH.minutes)}</span></div>
      <div class="pills" style="margin-top:12px"><button class="pill go" id="rp">▶ Replay</button><span class="lbl" id="rclock"></span></div>
      <div id="rs" style="margin-top:8px"></div>
      <p class="sub" id="rafter" style="margin-top:14px"></p></div></div>`;
  $('page').querySelectorAll('[data-h]').forEach(b => b.onclick = () => go('hole', { i: +b.dataset.h }));
  const shown = RH.searches_shown, hidden = RH.searches - shown.length;
  const run = VIEWS.hole.run = (VIEWS.hole.run || 0) + 1;   // a replay stops when you switch rabbit holes
  let k = shown.length - 1;
  const draw = () => { $('rs').innerHTML = shown.map((s, i) => `<div class="step ${i > k ? 'dim' : ''} ${i === k ? 'cur' : ''}"><span class="t">${at(s.min)}</span><span class="s">${s.q}</span></div>`).join('') +
    (hidden > 0 ? `<div class="step"><span class="t">…</span><span class="s" style="font-size:15px;color:var(--muted)"><span class="lock"></span> ${hidden} more ${hidden === 1 ? 'search stays' : 'searches stay'} private</span></div>` : '');
    $('rclock').textContent = k >= 0 ? `+${shown[k].min} min` : ''; $('rafter').textContent = k === shown.length - 1 ? RH.after : ''; };
  draw();
  $('rp').onclick = () => { k = -1; draw(); const tick = () => { if (cur !== 'hole' || run !== VIEWS.hole.run) return; k++; draw(); if (k < shown.length - 1) setTimeout(tick, reduce ? 0 : 900); }; setTimeout(tick, 300); };
};

// ----------------------------------------------------------------- CAREER: from a search to a job
VIEWS.career = () => {
  const c = CH.find(x => x.id === 'career'), K = D.career, ms = Object.entries(K.months), O = D.escaped;
  const SER = [['people', 'profiles she looked at', 'var(--rose)'], ['jobs', 'job postings', 'var(--t-food)'], ['companies', 'company pages', 'var(--t-places)'], ['messages', 'messages', 'var(--t-rest)']];
  const mx = Math.max(...ms.map(([, v]) => SER.reduce((a, [k]) => a + v[k], 0))), fm = K.families[0][1];
  $('page').innerHTML = `<div class="wrap">${head(c, `${fmt(K.total)} LinkedIn visits in a year. I study people about ${Math.round(K.kinds.people / K.kinds.jobs)}× more than job postings, and I hunt in waves. Which people, never shown; the roles and companies, yes.`)}
    <div class="panel"><div class="pills" style="margin-bottom:10px">${SER.map(([k, n, col]) => `<span class="pill" style="--c:${col}"><i></i>${n} <span style="color:var(--muted)">${fmt(K.kinds[k])}</span></span>`).join('')}</div>
      <div class="bars" style="height:200px">${ms.map(([m, v]) => `<button data-tipv="${new Date(m + '-15').toLocaleDateString('en-US', { month: 'long', year: 'numeric' })} · ${SER.map(([k, n]) => `${fmt(v[k])} ${n}`).join(' · ')}" style="justify-content:flex-end"><span style="display:flex;flex-direction:column-reverse;width:100%;height:${SER.reduce((a, [k]) => a + v[k], 0) / mx * 100}%;gap:1px">${SER.map(([k, , col]) => `<i style="height:${v[k] / Math.max(1, SER.reduce((a, [kk]) => a + v[kk], 0)) * 100}%;background:${col};border-radius:2px;min-height:0;opacity:1"></i>`).join('')}</span>${new Date(m + '-15').toLocaleDateString('en-US', { month: 'short' })}</button>`).join('')}</div>
      <p class="sub" style="margin-top:10px">Three waves: November, January and July. Hover a month.</p></div>
    <div class="two" style="margin-top:22px"><div class="panel"><div class="kicker">${fav('LinkedIn')} the roles she opened</div>
        ${K.families.map(([n, v]) => `<div class="row"><span></span><div>${n}<div class="track"><b style="width:${v / fm * 100}%"></b></div></div><span class="v">${v}</span></div>`).join('')}
        <p class="sub" style="margin-top:10px">Job postings she opened, grouped by title.</p></div>
      <div class="panel"><div class="kicker">companies she researched, by industry</div><p class="sub" style="margin:4px 0 6px">${K.company_pages} company pages on LinkedIn. Pick an industry.</p>
        <div class="pills" style="margin-bottom:12px">${K.industries.map((x, i) => `<button class="pill" data-ind="${i}" aria-pressed="${i === 0}">${x.industry} <span style="color:var(--muted)">${x.companies.length}</span></button>`).join('')}</div>
        <div class="pills" id="indc"></div></div></div>
    <div class="panel" style="margin-top:22px"><div class="kicker">${fav('Oracle')} one search that became a job</div>
      ${O.oracle_steps.map(s => `<div class="step"><span class="t">${s.date.length > 7 ? md(new Date(s.date + 'T12:00')) : new Date(s.date + '-15').toLocaleDateString('en-US', { month: 'short', year: 'numeric' })}</span><span class="s" style="font-size:16px">${s.what}</span></div>`).join('')}</div></div>`;
  const ind = i => { $('page').querySelectorAll('[data-ind]').forEach(x => x.setAttribute('aria-pressed', +x.dataset.ind === i));
    $('indc').innerHTML = K.industries[i].companies.map(x => `<span class="pill">${x.name}${x.days > 1 ? ` <span style="color:var(--muted)">${x.days} days</span>` : ''}</span>`).join(''); };
  $('page').querySelectorAll('[data-ind]').forEach(x => x.onclick = () => ind(+x.dataset.ind));
  const order = K.industries.map((x, i) => [x.companies.length, i]).sort((a, b) => b[0] - a[0]); ind(order[0][1]);
  $('page').querySelectorAll('[data-tipv]').forEach(b => { b.onpointerenter = e => showTip(e, b.dataset.tipv); b.onpointerleave = hideTip; });
};

// ----------------------------------------------------------------- LEARNING: the UT account's files
VIEWS.learning = (p = {}) => {
  const c = CH.find(x => x.id === 'learning'), L = D.learning, t0 = new Date(L[0].date), t1 = new Date(L.at(-1).date), x = d => (new Date(d) - t0) / (t1 - t0) * 100;
  const icon = { python: 'colab.research.google.com', web: 'github.com', product: 'docs.google.com', pitch: 'youtube.com', build: 'github.com' };
  const colr = { python: 'var(--t-food)', web: 'var(--t-places)', product: 'var(--t-beauty)', pitch: 'var(--t-fashion)', build: 'var(--rose)' };
  $('page').innerHTML = `<div class="wrap">${head(c, `${D.courses.length} courses my browser saw, semester by semester, and the file trail of how I learned to build. Classes leave few traces in a browser, so this is the floor of what I studied, not the whole of it.`)}
    <div class="terms">${[...new Set(D.courses.map(x => x.term))].map(t => `<div class="term"><div class="kicker">${t}</div>${D.courses.filter(x => x.term === t).map(x => `<div class="course${x.from === 'Canvas' ? '' : ' code'}" title="${x.from === 'Canvas' ? `on Canvas on ${x.days} ${x.days === 1 ? 'day' : 'days'}` : 'from her file names'}">${x.name}</div>`).join('')}</div>`).join('')}</div>
    <p class="sub" style="margin:8px 0 22px">Course names come from Canvas page titles; the course numbers come from her UT file names. Never grades or contents.</p>
    <div class="kicker" style="margin-bottom:8px">${fav('@colab')} how she learned to build · click a step, or use ← →</div>
    <div class="panel"><div class="line">${L.map((l, i) => `<button data-l="${i}" style="left:${x(l.date)}%;--c:${colr[l.track]}" aria-label="${l.step}">${fav(icon[l.track])}</button>`).join('')}
      ${['2025-09-01', '2025-12-01', '2026-03-01', '2026-06-01', '2026-09-01'].map(d => `<span class="m" style="left:${x(d)}%">${new Date(d + 'T12:00').toLocaleDateString('en-US', { month: 'short', year: '2-digit' })}</span>`).join('')}</div>
      <div id="lp" style="margin-top:18px"></div></div></div>`;
  let i = 0;
  const pick = j => { i = (j + L.length) % L.length; const l = L[i]; $('page').querySelectorAll('[data-l]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.l === i));
    $('lp').innerHTML = `<div class="kicker">${fav(icon[l.track])} ${l.track} · step ${i + 1} of ${L.length}</div><div class="big" style="margin-top:8px;font-family:var(--serif);font-weight:400">${l.step}</div><div class="sub">${new Date(l.date + 'T12:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</div>
      <div class="pills" style="margin-top:12px"><button class="pill" id="lprev">← earlier</button><button class="pill go" id="lnext">later →</button></div>`;
    $('lprev').onclick = () => pick(i - 1); $('lnext').onclick = () => pick(i + 1); };
  $('page').querySelectorAll('[data-l]').forEach(b => b.onclick = () => pick(+b.dataset.l)); pick(p.step ?? 0);
  const key = e => { if (cur !== 'learning') return removeEventListener('keydown', key); if (e.key === 'ArrowRight') pick(i + 1); if (e.key === 'ArrowLeft') pick(i - 1); };
  addEventListener('keydown', key);
};

addEventListener('keydown', e => { if (!/INPUT|TEXTAREA/.test(document.activeElement.tagName) && /^[0-9]$/.test(e.key) && !e.metaKey && !e.ctrlKey && CH[(+e.key + 9) % 10]) go(CH[(+e.key + 9) % 10].id); if (e.key === 'Escape') { $('ev').hidden = true; } if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('omniIn').focus(); $('omniIn').select(); } });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => go(cur, curP, false));
addEventListener('hashchange', () => { const id = location.hash.slice(1) || 'home'; if (id !== cur && !(id === 'home' && cur === 'search')) go(id); });
document.fonts.ready.then(() => go((location.hash || '#home').slice(1), {}, false));
}
fetch('data.json').then(r => r.json()).then(d => { D = d; main(); })
  .catch(() => { document.getElementById('page').innerHTML = '<div class="wrap"><p class="lede">The data did not load. Try reloading the page.</p></div>'; });
</script>
</body>
